server:
  port: 8080

spring:
  application:
    name: biblioteca

  datasource:
    url: jdbc:mariadb://localhost:3306/biblioteca?createDatabaseIfNotExist=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true